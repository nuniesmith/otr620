[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "truck-gps-controller"
version = "0.1.0"
description = "Simulation-first accessory controller for the truck-gps mount"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
truck-gps = "truck_gps.main:main"

[tool.setuptools.packages.find]
include = ["truck_gps*"]
